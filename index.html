<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.18) 0%, transparent 60%);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.4);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    h1 {
      text-align: center;
      font-size: 3em;
      margin: 0;
      background: linear-gradient(90deg, #60a5fa, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Formulário de Dados do Veículo */
    .form-veiculo {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 15px;
      margin: 20px 0;
    }
    .form-veiculo input, .form-veiculo select {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      background: #1e2937;
      color: white;
      border: 1px solid #60a5fa;
      font-size: 1.1em;
    }

    button.big-btn {
      width: 100%;
      padding: 20px;
      font-size: 1.5em;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
      margin-top: 15px;
    }

    /* Modal de Pagamento */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      background: #1e2937;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      border: 3px solid #60a5fa;
      max-width: 520px;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.7);
    }
    .modal-content h2 {
      color: #60a5fa;
      font-size: 2em;
      margin-bottom: 10px;
    }
    .payment-option {
      width: 100%;
      padding: 20px;
      margin: 12px 0;
      font-size: 1.4em;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    .payment-option:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255,255,255,0.3);
    }

    .ticket {
      background: #fff;
      color: #000;
      padding: 25px;
      border: 4px dashed #1e40af;
      border-radius: 12px;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,0.98);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div style="background:rgba(15,23,42,0.95);padding:50px;border-radius:20px;width:400px;text-align:center;border:2px solid #60a5fa;">
        <h1 style="font-size:3em;margin:0;">🅿️</h1>
        <h2 style="color:#60a5fa;">Estacionamento Simulator</h2>
        <button onclick="fazerLogin()" style="width:100%;padding:16px;font-size:1.2em;background:#3b82f6;color:white;border:none;border-radius:12px;margin-top:20px;">ENTRAR NO SISTEMA</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE PAGAMENTO -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <h2>💰 PAGAMENTO OBRIGATÓRIO</h2>
      <p id="modalVeiculoInfo" style="margin:20px 0;font-size:1.3em;"></p>
      
      <button class="payment-option" style="background:#22c55e;color:white;" onclick="confirmarPagamento('Dinheiro')">💵 DINHEIRO</button>
      <button class="payment-option" style="background:#3b82f6;color:white;" onclick="confirmarPagamento('Débito')">💳 DÉBITO</button>
      <button class="payment-option" style="background:#8b5cf6;color:white;" onclick="confirmarPagamento('Crédito')">💳 CRÉDITO</button>
      <button class="payment-option" style="background:#06b67f;color:white;" onclick="confirmarPagamento('PIX')">📱 PIX</button>
      
      <button onclick="fecharModal()" style="margin-top:25px;background:#ef4444;color:white;padding:14px 40px;border:none;border-radius:10px;font-size:1.1em;">Cancelar Pagamento</button>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ ESTACIONAMENTO</h1>

      <div class="form-veiculo">
        <h3>🚗 Dados do Veículo</h3>
        <input type="text" id="nomePessoa" placeholder="Nome do Cliente">
        <select id="modeloVeiculo">
          <option value="">Modelo do Carro</option>
          <option value="Volkswagen Gol">Volkswagen Gol</option>
          <option value="Chevrolet Onix">Chevrolet Onix</option>
          <option value="Hyundai HB20">Hyundai HB20</option>
          <option value="Toyota Corolla">Toyota Corolla</option>
          <option value="Honda Civic">Honda Civic</option>
          <option value="Toyota Hilux">Toyota Hilux</option>
        </select>
        <input type="text" id="placaInput" placeholder="Placa do Veículo (opcional)" style="text-transform:uppercase;">
        
        <button onclick="estacionarVeiculo()" class="big-btn">
          🚗 ESTACIONAR + GERAR TICKET
        </button>
      </div>

      <h2 style="margin-top:30px;">🎟️ Tickets Gerados</h2>
      <div id="listaVeiculos"></div>
    </div>
  </div>

  <script>
    let veiculos = {};
    let vagaOcupada = {};
    let veiculoParaPagar = null;
    const vagasTotais = 30;

    function fazerLogin() {
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('mainContent').style.display = "block";
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-' + String(Math.floor(Math.random() * 9000) + 1000);
      return placa;
    }

    function calcularValor(entrada) {
      const agora = new Date();
      const [h, m] = entrada.split(':').map(Number);
      const entradaDate = new Date();
      entradaDate.setHours(h, m);
      let horas = (agora - entradaDate) / (1000 * 60 * 60);
      if (horas <= 1) return 12;
      if (horas <= 2) return 20;
      if (horas > 7) return 50;
      return 35;
    }

    function mostrarTicket(veiculo, tipo = "ENTRADA") {
      let html = `
        <div class="ticket">
          <h2 style="text-align:center;color:#1e40af;">🎟️ TICKET DE ${tipo}</h2>
          <hr>
          <p><strong>Vaga:</strong> ${veiculo.vaga}</p>
          <p><strong>Placa:</strong> ${veiculo.placa}</p>
          <p><strong>Cliente:</strong> ${veiculo.nome}</p>
          <p><strong>Modelo:</strong> ${veiculo.modelo}</p>
          <p><strong>${tipo}:</strong> ${tipo === "ENTRADA" ? veiculo.entrada : veiculo.saida || '—'}</p>
      `;

      if (tipo === "ENTRADA") {
        html += `<button onclick="abrirModalPagamento('${veiculo.placa}')" style="margin-top:15px;padding:14px 30px;background:#22c55e;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Sair + Pagar</button>`;
      }

      html += `</div>`;

      const div = document.createElement('div');
      div.innerHTML = html;
      document.getElementById('listaVeiculos').prepend(div);
    }

    function abrirModalPagamento(placa) {
      veiculoParaPagar = placa;
      const v = veiculos[placa];
      document.getElementById('modalVeiculoInfo').innerHTML = `
        <strong>Vaga ${v.vaga} — ${v.placa}</strong><br>
        ${v.nome} • ${v.modelo}
      `;
      document.getElementById('paymentModal').style.display = "flex";
    }

    function confirmarPagamento(forma) {
      const veiculo = veiculos[veiculoParaPagar];
      if (!veiculo) return;

      veiculo.saida = formatarHora();
      const valor = calcularValor(veiculo.entrada);

      mostrarTicket(veiculo, "SAIDA");

      delete veiculos[veiculoParaPagar];
      delete vagaOcupada[veiculo.vaga];

      fecharModal();
      alert(`✅ Pagamento de R$ ${valor} realizado com ${forma}!`);
    }

    function fecharModal() {
      document.getElementById('paymentModal').style.display = "none";
    }

    function estacionarVeiculo() {
      const nome = document.getElementById('nomePessoa').value.trim();
      const modelo = document.getElementById('modeloVeiculo').value;

      if (!nome || !modelo) {
        alert("⚠️ Nome do cliente e Modelo do carro são obrigatórios!");
        return;
      }

      let vaga = null;
      for (let i = 1; i <= vagasTotais; i++) {
        if (!vagaOcupada[i]) {
          vaga = i;
          break;
        }
      }

      const placa = document.getElementById('placaInput').value.trim().toUpperCase() || gerarPlaca();

      const veiculo = {
        placa: placa,
        vaga: vaga,
        nome: nome,
        modelo: modelo,
        entrada: formatarHora()
      };

      veiculos[placa] = veiculo;
      vagaOcupada[vaga] = placa;

      mostrarTicket(veiculo, "ENTRADA");

      // Limpar
      document.getElementById('nomePessoa').value = '';
      document.getElementById('placaInput').value = '';
      document.getElementById('modeloVeiculo').value = '';
    }
  </script>
</body>
</html>
