<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; margin-bottom: 10px; }
    .status {
      text-align: center;
      font-size: 1.3em;
      margin: 20px 0;
      padding: 15px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }
    .vaga {
      display: inline-block;
      width: 40px;
      height: 40px;
      margin: 5px;
      border-radius: 8px;
      text-align: center;
      line-height: 40px;
      font-weight: bold;
    }
    .ocupada { background: #ef4444; }
    .livre { background: #22c55e; }

    .veiculo-card {
      background: rgba(255,255,255,0.1);
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border-left: 5px solid #3b82f6;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 6px;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #2563eb; }
    .remover-btn {
      background: #ef4444;
    }
    .log {
      max-height: 300px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🅿️ Estacionamento Simulator</h1>
    
    <div class="status" id="status">
      Vagas Totais: <strong>20</strong> | 
      Ocupadas: <strong id="ocupadas">0</strong> | 
      Sobrando: <strong id="sobrando">20</strong>
    </div>

    <div style="text-align: center; margin: 15px 0;">
      <button onclick="estacionarVeiculo()">🚗 Estacionar Novo Veículo</button>
    </div>

    <div>
      <input type="text" id="placaRemover" placeholder="Digite a placa (ex: ABC-1234)" style="width: 250px;">
      <button onclick="removerVeiculo()">Remover Veículo</button>
    </div>

    <h2>Veículos Estacionados</h2>
    <div id="listaVeiculos"></div>

    <div class="log" id="log"></div>
  </div>

  <script>
    let vagasTotais = 20;
    let veiculos = {}; // placa -> dados

    function gerarCPF() {
      let cpf = Array.from({length: 9}, () => Math.floor(Math.random() * 10));
      let d1 = cpf.reduce((sum, num, i) => sum + num * (10 - i), 0) % 11;
      d1 = d1 < 2 ? 0 : 11 - d1;
      cpf.push(d1);
      
      let d2 = cpf.reduce((sum, num, i) => sum + num * (11 - i), 0) % 11;
      d2 = d2 < 2 ? 0 : 11 - d2;
      cpf.push(d2);
      return cpf.join('');
    }

    function gerarRG() {
      let rg = Array.from({length: 9}, () => Math.floor(Math.random() * 10)).join('');
      return `${rg.slice(0,2)}.${rg.slice(2,5)}.${rg.slice(5,8)}-${rg[8]}`;
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const numeros = '0123456789';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-';
      for (let i = 0; i < 4; i++) placa += numeros[Math.floor(Math.random() * 10)];
      return placa;
    }

    function adicionarLog(mensagem, tipo = 'info') {
      const log = document.getElementById('log');
      const hora = new Date().toLocaleTimeString('pt-BR');
      const cor = tipo === 'sucesso' ? 'lime' : tipo === 'erro' ? 'red' : 'white';
      log.innerHTML += `<span style="color:${cor}">[${hora}] ${mensagem}</span><br>`;
      log.scrollTop = log.scrollHeight;
    }

    function atualizarStatus() {
      const ocupadas = Object.keys(veiculos).length;
      document.getElementById('ocupadas').textContent = ocupadas;
      document.getElementById('sobrando').textContent = vagasTotais - ocupadas;
    }

    function estacionarVeiculo() {
      const ocupadas = Object.keys(veiculos).length;
      if (ocupadas >= vagasTotais) {
        adicionarLog("❌ Estacionamento lotado!", "erro");
        return;
      }

      const placa = gerarPlaca();
      const veiculo = {
        placa: placa,
        modelo: ["Gol", "Uno", "Onix", "HB20", "Corolla", "Civic", "Hilux", "S10", "Fusca"][Math.floor(Math.random()*9)],
        cpf: gerarCPF(),
        rg: gerarRG(),
        entrada: new Date().toLocaleTimeString('pt-BR')
      };

      veiculos[placa] = veiculo;
      atualizarStatus();
      mostrarVeiculos();
      adicionarLog(`✅ Veículo estacionado! Placa: ${placa}`, "sucesso");
    }

    function removerVeiculo() {
      const placaInput = document.getElementById('placaRemover').value.trim().toUpperCase();
      if (!placaInput) {
        adicionarLog("⚠️ Digite uma placa!", "erro");
        return;
      }

      if (veiculos[placaInput]) {
        const v = veiculos[placaInput];
        delete veiculos[placaInput];
        atualizarStatus();
        mostrarVeiculos();
        adicionarLog(`🚪 Veículo removido - Placa: ${placaInput}`, "sucesso");
        document.getElementById('placaRemover').value = '';
      } else {
        adicionarLog(`❌ Veículo com placa ${placaInput} não encontrado!`, "erro");
      }
    }

    function mostrarVeiculos() {
      const lista = document.getElementById('listaVeiculos');
      lista.innerHTML = '';

      if (Object.keys(veiculos).length === 0) {
        lista.innerHTML = '<p style="text-align:center; color:#aaa;">Nenhum veículo estacionado.</p>';
        return;
      }

      for (let placa in veiculos) {
        const v = veiculos[placa];
        const card = document.createElement('div');
        card.className = 'veiculo-card';
        card.innerHTML = `
          <strong>${v.placa}</strong> - ${v.modelo}<br>
          CPF: ${v.cpf} | RG: ${v.rg}<br>
          Entrada: ${v.entrada}
          <button class="remover-btn" onclick="removerPorPlaca('${placa}')" style="float:right; padding:5px 10px; font-size:0.9em;">Remover</button>
        `;
        lista.appendChild(card);
      }
    }

    function removerPorPlaca(placa) {
      if (veiculos[placa]) {
        delete veiculos[placa];
        atualizarStatus();
        mostrarVeiculos();
        adicionarLog(`🚪 Veículo removido - Placa: ${placa}`, "sucesso");
      }
    }

    // Inicializa
    atualizarStatus();
    mostrarVeiculos();
    adicionarLog("Bem-vindo ao Estacionamento Simulator! 🎮");
  </script>
</body>
</html>
