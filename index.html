<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.25) 0%, transparent 60%);
    }

    /* Tela de Login Melhorada */
    #loginScreen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10,10,10,0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-box {
      background: rgba(15, 23, 42, 0.95);
      padding: 60px 50px;
      border-radius: 25px;
      width: 420px;
      text-align: center;
      border: 2px solid #60a5fa;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.6);
    }
    .login-box h1 {
      font-size: 4em;
      margin: 0 0 10px 0;
      background: linear-gradient(90deg, #60a5fa, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-box h2 {
      color: #93c5fd;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      background: #1e2937;
      color: white;
      border: 1px solid #60a5fa;
      font-size: 1.1em;
    }
    button.login-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.4em;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.7);
    }
    button.login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.9);
    }
  </style>
</head>
<body>

  <!-- TELA DE ENTRADA (LOGIN) MELHORADA -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>🅿️</h1>
      <h2>Estacionamento Simulator</h2>
      <p style="color:#94a3b8;margin-bottom:30px;">Sistema de Gestão Profissional</p>
      
      <input type="text" id="username" value="admin" placeholder="Usuário"><br>
      <input type="password" id="password" value="1234" placeholder="Senha"><br>
      
      <button onclick="fazerLogin()" class="login-btn">ENTRAR NO SISTEMA</button>
      
      <p style="margin-top:25px;color:#64748b;font-size:0.95em;">
        Usuário: <strong>admin</strong><br>
        Senha: <strong>1234</strong>
      </p>
    </div>
  </div>

  <!-- O resto do sistema (você pode colar o conteúdo anterior aqui) -->
  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ ESTACIONAMENTO</h1>
      <p style="text-align:center;color:#94a3b8;">Bem-vindo ao sistema!</p>
      
      <!-- Aqui vai o resto do seu sistema (formulário de veículo, tickets, etc.) -->
      <div style="text-align:center;margin:50px 0;">
        <h2>Sistema carregado com sucesso!</h2>
        <p>Você pode continuar adicionando as funcionalidades anteriores.</p>
      </div>
    </div>
  </div>

  <script>
    function fazerLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === "admin" && pass === "1234") {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('mainContent').style.display = "block";
      } else {
        alert("❌ Usuário ou senha incorretos!\n\nTente: admin / 1234");
      }
    }
  </script>
</body>
</html>
