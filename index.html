<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Estacionamento com Cadastro</title>
  <style>
    body { 
      margin: 0; 
      background: #eee; 
      font-family: Arial, sans-serif; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* centraliza verticalmente */
    }
    canvas { 
      display: none; 
      margin: auto; 
      background: #d3d3d3; /* fundo cinza claro */
    }
    #formCadastro { 
      text-align: center; 
      padding: 20px;
      background: #111; /* fundo escuro para contraste */
      border-radius: 10px;
      box-shadow: 0 0 20px cyan; /* efeito LED azul */
    }
    #formCadastro h2 {
      font-size: 32px;
      color: blue;
      text-shadow: 0 0 15px cyan; /* efeito neon */
    }
    input { 
      margin: 10px; 
      padding: 12px; 
      width: 280px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
    }
    button { 
      padding: 12px 25px; 
      margin-top: 15px;
      font-size: 20px;
      background: blue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 15px cyan; /* efeito LED no botão */
    }
    button:hover {
      background: darkblue;
    }
  </style>
</head>
<body>
  <!-- Formulário de cadastro -->
  <div id="formCadastro">
    <h2>Cadastro de Cliente</h2>
    <input type="text" id="nome" placeholder="Nome do motorista" required><br>
    <input type="text" id="cpf" placeholder="CPF" required><br>
    <input type="text" id="celular" placeholder="Número de celular" required><br>
    <input type="email" id="email" placeholder="Email" required><br>
    <button onclick="iniciarJogo()">Cadastrar e Jogar</button>
  </div>

  <!-- Canvas do jogo -->
  <canvas id="gameCanvas" width="500" height="500"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const car = { x: 50, y: 400, width: 40, height: 70, color: "blue" };
    const spot = { x: 200, y: 100, width: 50, height: 80, color: "green" };

    function iniciarJogo() {
      const nome = document.getElementById("nome").value;
      const cpf = document.getElementById("cpf").value;
      const celular = document.getElementById("celular").value;
      const email = document.getElementById("email").value;

      if (nome && cpf && celular && email) {
        document.getElementById("formCadastro").style.display = "none";
        canvas.style.display = "block";
        alert("Bem-vindo, " + nome + "! Boa sorte no estacionamento.");
        gameLoop();
      } else {
        alert("Por favor, preencha todos os campos.");
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") car.y -= 5;
      if (e.key === "ArrowDown") car.y += 5;
      if (e.key === "ArrowLeft") car.x -= 5;
      if (e.key === "ArrowRight") car.x += 5;
    });

    function drawCar() {
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.width, car.height);
    }

    function drawSpot() {
      ctx.strokeStyle = spot.color;
      ctx.strokeRect(spot.x, spot.y, spot.width, spot.height);
    }

    function checkWin() {
      if (
        car.x < spot.x + spot.width &&
        car.x + car.width > spot.x &&
        car.y < spot.y + spot.height &&
        car.y + car.height > spot.y
      ) {
        // Texto centralizado com efeito LED
        ctx.font = "bold 60px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "blue";
        ctx.shadowColor = "cyan";
        ctx.shadowBlur = 30;
        ctx.fillText("ESTACIONADO!", canvas.width / 2, canvas.height / 2);

        ctx.shadowBlur = 0; // resetar sombra
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCar();
      drawSpot();
      checkWin();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
