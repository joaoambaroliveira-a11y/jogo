<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 
        0 0 40px rgba(59, 130, 246, 0.3),
        inset 0 0 20px rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    h1 {
      text-align: center;
      font-size: 2.8em;
      margin: 0 0 10px 0;
      background: linear-gradient(90deg, #60a5fa, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      background: rgba(0,0,0,0.4);
      padding: 6px;
      border-radius: 12px;
    }
    .tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }
    .tab.active {
      background: #3b82f6;
      color: white;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
    }

    button.big-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.4em;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
      transition: all 0.3s;
    }
    button.big-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.8);
    }

    .ticket {
      background: #fff;
      color: #000;
      padding: 20px;
      border: 4px dashed #1e40af;
      border-radius: 12px;
      margin: 15px 0;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,0.98);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div style="background:rgba(15,23,42,0.95);padding:50px;border-radius:20px;width:380px;text-align:center;border:1px solid #60a5fa;">
        <h1 style="margin:0 0 20px 0; font-size:2.5em;">🅿️</h1>
        <h2 style="color:#60a5fa;">Estacionamento Simulator</h2>
        <p style="color:#94a3b8;">Sistema de Gestão</p>
        
        <input type="text" id="username" value="admin" placeholder="Usuário" style="width:100%;padding:14px;margin:15px 0;border-radius:8px;background:#1e2937;color:white;border:1px solid #60a5fa;"><br>
        <input type="password" id="password" value="1234" placeholder="Senha" style="width:100%;padding:14px;margin:15px 0;border-radius:8px;background:#1e2937;color:white;border:1px solid #60a5fa;"><br>
        
        <button onclick="fazerLogin()" style="width:100%;padding:16px;font-size:1.2em;background:#3b82f6;color:white;border:none;border-radius:10px;margin-top:10px;">ENTRAR NO SISTEMA</button>
      </div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ ESTACIONAMENTO</h1>
      <p class="subtitle">Sistema de Controle • Gestão Profissional</p>
      
      <div class="tabs">
        <div class="tab active" onclick="showTab(0)">📋 Cadastrar Cliente</div>
        <div class="tab" onclick="showTab(1)">🚗 Estacionamento</div>
      </div>

      <!-- O resto do seu conteúdo vai aqui (tickets, formulários, etc.) -->
      <div id="tab0" style="display:none;">
        <!-- Cadastro de cliente -->
      </div>

      <div id="tab1">
        <!-- Área de estacionamento -->
        <div style="text-align:center; margin:30px 0;">
          <button onclick="estacionarVeiculo()" class="big-btn">
            🚗 ESTACIONAR + GERAR TICKET
          </button>
        </div>
      </div>

      <div id="listaVeiculos"></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    function fazerLogin() {
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('mainContent').style.display = "block";
    }

    function showTab(n) {
      document.getElementById('tab0').style.display = n === 0 ? 'block' : 'none';
      document.getElementById('tab1').style.display = n === 1 ? 'block' : 'none';
    }

    // Exemplo de função para estacionar (você pode colar o resto do código anterior aqui)
    function estacionarVeiculo() {
      alert("🚗 Veículo estacionado! Ticket gerado.");
      // Aqui você coloca o código de estacionamento que já tínhamos
    }
  </script>
</body>
</html>
