<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .ticket {
      background: #fff;
      color: #000;
      padding: 20px;
      border: 4px dashed #000;
      border-radius: 12px;
      margin: 15px 0;
      max-width: 420px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    .payment-btn {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .dinheiro { background: #22c55e; color: white; }
    .debito { background: #3b82f6; color: white; }
    .credito { background: #8b5cf6; color: white; }
    .pix { background: #06b67f; color: white; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.95);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div style="background:rgba(255,255,255,0.1);padding:40px;border-radius:15px;width:360px;text-align:center;">
        <h2>🔐 Login do Sistema</h2>
        <input type="text" id="username" value="admin" placeholder="Usuário"><br><br>
        <input type="password" id="password" value="1234" placeholder="Senha"><br><br>
        <button onclick="fazerLogin()" style="width:100%;padding:14px;">Entrar</button>
      </div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ Estacionamento Simulator</h1>

      <div style="background:rgba(0,0,0,0.3);padding:25px;border-radius:12px;margin:20px 0;">
        <h3>🚗 Estacionar Veículo</h3>
        <input type="text" id="nomePessoa" placeholder="Nome do Proprietário" style="width:100%;padding:12px;margin:8px 0;">
        <select id="modeloVeiculo" style="width:100%;padding:12px;margin:8px 0;">
          <option value="">Escolha o modelo</option>
          <option value="Volkswagen Gol">Volkswagen Gol</option>
          <option value="Chevrolet Onix">Chevrolet Onix</option>
          <option value="Hyundai HB20">Hyundai HB20</option>
          <option value="Toyota Corolla">Toyota Corolla</option>
        </select>
        <br><br>
        <button onclick="estacionarVeiculo()" style="padding:16px 32px;font-size:1.3em;background:#22c55e;color:white;border:none;border-radius:8px;">
          🚗 Estacionar + Gerar Ticket
        </button>
      </div>

      <h2>🎟️ Tickets Gerados</h2>
      <div id="listaVeiculos"></div>

      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const vagasTotais = 30;
    let veiculos = {};
    let vagaOcupada = {};

    function fazerLogin() {
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('mainContent').style.display = "block";
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function adicionarLog(mensagem) {
      const log = document.getElementById('log');
      const hora = formatarHora();
      log.innerHTML += `<span style="color:#4ade80">[${hora}] ${mensagem}</span><br>`;
      log.scrollTop = log.scrollHeight;
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-' + String(Math.floor(Math.random() * 9000) + 1000);
      return placa;
    }

    function calcularValor(entrada) {
      const agora = new Date();
      const [h, m] = entrada.split(':').map(Number);
      const entradaDate = new Date();
      entradaDate.setHours(h, m);
      const horas = (agora - entradaDate) / (1000 * 60 * 60);
      return (horas * 12).toFixed(2); // R$ 12 por hora
    }

    function mostrarTicket(veiculo, tipo = "ENTRADA", pagamento = "") {
      let html = `
        <div class="ticket">
          <h2 style="text-align:center;margin:0;">🎟️ TICKET DE ${tipo}</h2>
          <hr>
          <p><strong>Vaga:</strong> ${veiculo.vaga}</p>
          <p><strong>Placa:</strong> ${veiculo.placa}</p>
          <p><strong>Nome:</strong> ${veiculo.nome}</p>
          <p><strong>Modelo:</strong> ${veiculo.modelo}</p>
          <p><strong>${tipo}:</strong> ${tipo === "ENTRADA" ? veiculo.entrada : veiculo.saida}</p>
      `;

      if (tipo === "SAIDA") {
        const valor = calcularValor(veiculo.entrada);
        html += `
          <h3 style="color:#d32f2f;text-align:center;">Valor Total: R$ ${valor}</h3>
          <p><strong>Pagamento:</strong> ${pagamento || "Não informado"}</p>
        `;
      }

      html += `</div>`;
      
      const div = document.createElement('div');
      div.innerHTML = html;
      document.getElementById('listaVeiculos').prepend(div);
    }

    function estacionarVeiculo() {
      const nome = document.getElementById('nomePessoa').value.trim();
      if (!nome) {
        alert("Digite o nome do proprietário!");
        return;
      }

      let vaga = null;
      for (let i = 1; i <= vagasTotais; i++) {
        if (!vagaOcupada[i]) {
          vaga = i;
          break;
        }
      }

      const modelo = document.getElementById('modeloVeiculo').value || "Veículo Genérico";
      const placa = gerarPlaca();

      const veiculo = { placa, vaga, nome, modelo, entrada: formatarHora() };
      veiculos[placa] = veiculo;
      vagaOcupada[vaga] = placa;

      mostrarTicket(veiculo, "ENTRADA");
      adicionarLog(`✅ Ticket gerado - Vaga ${vaga}`);

      document.getElementById('nomePessoa').value = '';
      document.getElementById('modeloVeiculo').value = '';
    }

    // Função para registrar saída com forma de pagamento
    function registrarSaida(placa) {
      const veiculo = veiculos[placa];
      if (!veiculo) return;

      veiculo.saida = formatarHora();

      const pagamento = prompt("Escolha a forma de pagamento:\n\n1 - Dinheiro\n2 - Débito\n3 - Crédito\n4 - PIX\n\nDigite o número:");

      let forma = "Não informado";
      if (pagamento === "1") forma = "💵 Dinheiro";
      else if (pagamento === "2") forma = "💳 Débito";
      else if (pagamento === "3") forma = "💳 Crédito";
      else if (pagamento === "4") forma = "📱 PIX";

      mostrarTicket(veiculo, "SAIDA", forma);

      delete veiculos[placa];
      delete vagaOcupada[veiculo.vaga];

      adicionarLog(`💰 Saída registrada - Pagamento: ${forma}`);
    }

    window.onload = () => {
      adicionarLog("🚀 Sistema carregado. Estacione um veículo!");
    };
  </script>
</body>
</html>
