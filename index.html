<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Estacionamento</title>
  <style>
    body { margin: 0; background: #eee; }
    canvas { display: block; margin: auto; background: #ccc; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="500" height="500"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Carro
    const car = { x: 50, y: 400, width: 40, height: 70, color: "blue" };

    // Vaga de estacionamento
    const spot = { x: 200, y: 100, width: 50, height: 80, color: "green" };

    // Movimento
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") car.y -= 5;
      if (e.key === "ArrowDown") car.y += 5;
      if (e.key === "ArrowLeft") car.x -= 5;
      if (e.key === "ArrowRight") car.x += 5;
    });

    function drawCar() {
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.width, car.height);
    }

    function drawSpot() {
      ctx.strokeStyle = spot.color;
      ctx.strokeRect(spot.x, spot.y, spot.width, spot.height);
    }

    function checkWin() {
      if (
        car.x < spot.x + spot.width &&
        car.x + car.width > spot.x &&
        car.y < spot.y + spot.height &&
        car.y + car.height > spot.y
      ) {
        ctx.fillStyle = "black";
        ctx.font = "30px Arial";
        ctx.fillText("Estacionado!", 150, 250);
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCar();
      drawSpot();
      checkWin();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
