<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #e0f2fe;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-container {
      background: rgba(15, 23, 42, 0.95);
      padding: 60px 50px;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      border: 2px solid #60a5fa;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.5);
      position: relative;
    }

    .logo {
      font-size: 5.5em;
      line-height: 1;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #60a5fa, #93c5fd, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 8px;
      color: #bae6fd;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
      font-size: 1.1em;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      margin: 12px 0;
      background: #1e2937;
      border: 2px solid #334155;
      border-radius: 12px;
      color: white;
      font-size: 1.1em;
      transition: 0.3s;
    }
    input:focus {
      border-color: #60a5fa;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
    }
    button:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(59, 130, 246, 0.6);
    }

    .info {
      margin-top: 30px;
      font-size: 0.95em;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">🅿️</div>
    <h1>Estacionamento Simulator</h1>
    <p class="subtitle">Gestão Inteligente de Veículos</p>

    <input type="text" id="username" value="admin" placeholder="Usuário"><br>
    <input type="password" id="password" value="1234" placeholder="Senha"><br>

    <button onclick="fazerLogin()">ENTRAR NO SISTEMA</button>

    <div class="info">
      Usuário: <strong>admin</strong><br>
      Senha: <strong>1234</strong>
    </div>
  </div>

  <script>
    function fazerLogin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (user === "admin" && pass === "1234") {
        alert("✅ Login realizado com sucesso!\n\nBem-vindo ao sistema.");
        // Aqui você pode redirecionar para a página principal ou mostrar o conteúdo
        window.location.reload(); // Simula entrada no sistema
      } else {
        alert("❌ Usuário ou senha incorretos!\n\nTente:\nUsuário: admin\nSenha: 1234");
      }
    }

    // Pressionar Enter também faz login
    document.addEventListener("keypress", function(e) {
      if (e.key === "Enter") fazerLogin();
    });
  </script>
</body>
</html>
