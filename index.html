<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo de Estacionamento com Cadastro</title>
  <style>
    body { 
      margin: 0; 
      background: #eee; 
      font-family: Arial, sans-serif; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas { 
      display: none; 
      margin: auto; 
      background: #d3d3d3; /* fundo cinza claro */
    }
    #formCadastro { 
      text-align: center; 
      padding: 20px;
      background: #111;
      border-radius: 10px;
      box-shadow: 0 0 20px cyan;
    }
    #formCadastro h2 {
      font-size: 32px;
      color: blue;
      text-shadow: 0 0 15px cyan;
    }
    input { 
      margin: 10px; 
      padding: 12px; 
      width: 280px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
    }
    button { 
      padding: 12px 25px; 
      margin-top: 15px;
      font-size: 20px;
      background: blue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 15px cyan;
    }
    button:hover {
      background: darkblue;
    }
  </style>
</head>
<body>
  <!-- Formulário de cadastro -->
  <div id="formCadastro">
    <h2>Cadastro de Cliente</h2>
    <input type="text" id="nome" placeholder="Nome do motorista" required><br>
    <input type="text" id="cpf" placeholder="CPF" required><br>
    <input type="text" id="celular" placeholder="Número de celular" required><br>
    <input type="email" id="email" placeholder="Email" required><br>
    <button onclick="iniciarJogo()">Cadastrar e Jogar</button>
  </div>

  <!-- Canvas do jogo -->
  <canvas id="gameCanvas" width="500" height="500"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const car = { x: 0, y: 0, width: 40, height: 70, color: "blue" };

    // Lista de vagas
    const spots = [
      { x: 50, y: 50, width: 50, height: 80, ocupado: false },
      { x: 150, y: 50, width: 50, height: 80, ocupado: false },
      { x: 250, y: 50, width: 50, height: 80, ocupado: false },
      { x: 350, y: 50, width: 50, height: 80, ocupado: false }
    ];

    function iniciarJogo() {
      const nome = document.getElementById("nome").value;
      const cpf = document.getElementById("cpf").value;
      const celular = document.getElementById("celular").value;
      const email = document.getElementById("email").value;

      if (nome && cpf && celular && email) {
        document.getElementById("formCadastro").style.display = "none";
        canvas.style.display = "block";

        // Encontrar vaga livre
        const vagaLivre = spots.find(s => !s.ocupado);
        if (vagaLivre) {
          car.x = vagaLivre.x;
          car.y = vagaLivre.y;
          vagaLivre.ocupado = true;
          alert("Bem-vindo, " + nome + "! Você estacionou na vaga.");
        } else {
          alert("Não há vagas disponíveis!");
        }

        gameLoop();
      } else {
        alert("Por favor, preencha todos os campos.");
      }
    }

    function drawCar() {
      ctx.fillStyle = car.color;
      ctx.fillRect(car.x, car.y, car.width, car.height);
    }

    function drawSpots() {
      spots.forEach(s => {
        ctx.strokeStyle = s.ocupado ? "red" : "green";
        ctx.lineWidth = 3;
        ctx.strokeRect(s.x, s.y, s.width, s.height);
      });
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSpots();
      drawCar();
      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
