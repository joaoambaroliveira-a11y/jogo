<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.18) 0%, transparent 60%);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.4);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    h1 {
      text-align: center;
      font-size: 3em;
      margin: 0;
      background: linear-gradient(90deg, #60a5fa, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(59, 130, 246, 0.7);
    }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 25px; }

    .tabs {
      display: flex;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      border-radius: 15px;
      margin-bottom: 25px;
    }
    .tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    .tab.active {
      background: #3b82f6;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
    }

    button.big-btn {
      width: 100%;
      padding: 20px;
      font-size: 1.5em;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
      transition: all 0.3s;
    }
    button.big-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.9);
    }

    .ticket {
      background: #fff;
      color: #000;
      padding: 22px;
      border: 4px dashed #1e40af;
      border-radius: 12px;
      margin: 15px 0;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      transition: 0.3s;
    }
    .ticket:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
    }
    .payment-options button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginScreen">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,0.98);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div style="background:rgba(15,23,42,0.95);padding:50px 40px;border-radius:20px;width:400px;text-align:center;border:2px solid #60a5fa;box-shadow:0 0 40px rgba(59,130,246,0.5);">
        <h1 style="font-size:3em;margin:0;">🅿️</h1>
        <h2 style="color:#60a5fa;margin:10px 0;">Estacionamento Simulator</h2>
        <p style="color:#94a3b8;">Gestão Profissional</p>
        
        <input type="text" id="username" value="admin" placeholder="Usuário" style="width:100%;padding:14px;margin:15px 0;border-radius:10px;background:#1e2937;color:white;border:1px solid #60a5fa;"><br>
        <input type="password" id="password" value="1234" placeholder="Senha" style="width:100%;padding:14px;margin:15px 0;border-radius:10px;background:#1e2937;color:white;border:1px solid #60a5fa;"><br>
        
        <button onclick="fazerLogin()" style="width:100%;padding:16px;font-size:1.2em;background:#3b82f6;color:white;border:none;border-radius:12px;margin-top:10px;">ENTRAR NO SISTEMA</button>
      </div>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ ESTACIONAMENTO</h1>
      <p class="subtitle">Sistema Moderno de Controle</p>

      <div class="tabs">
        <div class="tab active" onclick="showTab(0)">📋 Cadastrar Cliente</div>
        <div class="tab" onclick="showTab(1)">🚗 Estacionamento</div>
      </div>

      <!-- ABA ESTACIONAMENTO -->
      <div id="tab1">
        <div style="background:rgba(0,0,0,0.4);padding:30px;border-radius:15px;text-align:center;margin:20px 0;">
          <button onclick="estacionarVeiculo()" class="big-btn">
            🚗 ESTACIONAR + GERAR TICKET
          </button>
        </div>

        <h2 style="margin-top:30px;">🎟️ Tickets Gerados</h2>
        <div id="listaVeiculos"></div>
      </div>

      <div class="log" id="log" style="margin-top:20px;"></div>
    </div>
  </div>

  <script>
    let veiculos = {};
    let vagaOcupada = {};
    const vagasTotais = 30;

    function fazerLogin() {
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('mainContent').style.display = "block";
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-' + String(Math.floor(Math.random() * 9000) + 1000);
      return placa;
    }

    function calcularValor(entrada) {
      const agora = new Date();
      const [h, m] = entrada.split(':').map(Number);
      const entradaDate = new Date();
      entradaDate.setHours(h, m);
      const horas = (agora - entradaDate) / (1000 * 60 * 60);
      return (horas * 12).toFixed(2);
    }

    function mostrarTicket(veiculo, tipo = "ENTRADA") {
      let html = `
        <div class="ticket">
          <h2 style="text-align:center;margin:0;color:#1e40af;">🎟️ TICKET DE ${tipo}</h2>
          <hr>
          <p><strong>Vaga:</strong> ${veiculo.vaga} | <strong>Placa:</strong> ${veiculo.placa}</p>
          <p><strong>Nome:</strong> ${veiculo.nome}</p>
          <p><strong>Modelo:</strong> ${veiculo.modelo}</p>
          <p><strong>${tipo}:</strong> ${tipo === "ENTRADA" ? veiculo.entrada : veiculo.saida}</p>
      `;

      if (tipo === "SAIDA") {
        const valor = calcularValor(veiculo.entrada);
        html += `<h3 style="color:#b91c1c;text-align:center;">Valor Total: R$ ${valor}</h3>`;
      }

      html += `
          <div class="payment-options" style="margin-top:15px;">
            <button onclick="registrarPagamento('${veiculo.placa}', 'Dinheiro')" style="background:#22c55e;color:white;">💵 Dinheiro</button>
            <button onclick="registrarPagamento('${veiculo.placa}', 'Débito')" style="background:#3b82f6;color:white;">💳 Débito</button>
            <button onclick="registrarPagamento('${veiculo.placa}', 'Crédito')" style="background:#8b5cf6;color:white;">💳 Crédito</button>
            <button onclick="registrarPagamento('${veiculo.placa}', 'PIX')" style="background:#06b67f;color:white;">📱 PIX</button>
          </div>
        </div>`;

      const div = document.createElement('div');
      div.innerHTML = html;
      document.getElementById('listaVeiculos').prepend(div);
    }

    function registrarPagamento(placa, forma) {
      const veiculo = veiculos[placa];
      if (!veiculo) return;

      veiculo.saida = formatarHora();
      mostrarTicket(veiculo, "SAIDA");

      delete veiculos[placa];
      delete vagaOcupada[veiculo.vaga];

      alert(`✅ Pagamento registrado com sucesso!\nForma: ${forma}`);
    }

    function estacionarVeiculo() {
      const nome = document.getElementById('nomePessoa') ? document.getElementById('nomePessoa').value.trim() : prompt("Nome do proprietário:");
      if (!nome) {
        alert("Nome é obrigatório!");
        return;
      }

      let vaga = null;
      for (let i = 1; i <= vagasTotais; i++) {
        if (!vagaOcupada[i]) {
          vaga = i;
          break;
        }
      }

      const modelo = "Veículo";
      const placa = gerarPlaca();

      const veiculo = { placa, vaga, nome, modelo, entrada: formatarHora() };
      veiculos[placa] = veiculo;
      vagaOcupada[vaga] = placa;

      mostrarTicket(veiculo, "ENTRADA");
      alert(`✅ Veículo estacionado na Vaga ${vaga}!`);
    }

    function showTab(n) {
      // Para futuras abas
    }

    window.onload = () => {
      document.getElementById('tab1').style.display = 'block';
    };
  </script>
</body>
</html>
