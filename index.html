<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estacionamento com Cadastro Completo</title>
  <style>
    body { 
      margin: 0; 
      background: #eee; 
      font-family: Arial, sans-serif; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas { 
      display: none; 
      margin: auto; 
      background: #d3d3d3; /* fundo cinza claro */
    }
    #formCadastro { 
      text-align: center; 
      padding: 20px;
      background: #111;
      border-radius: 10px;
      box-shadow: 0 0 20px cyan;
    }
    #formCadastro h2 {
      font-size: 32px;
      color: blue;
      text-shadow: 0 0 15px cyan;
    }
    input, select { 
      margin: 10px; 
      padding: 12px; 
      width: 280px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
    }
    button { 
      padding: 12px 25px; 
      margin-top: 15px;
      font-size: 20px;
      background: blue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 15px cyan;
    }
    button:hover {
      background: darkblue;
    }
  </style>
</head>
<body>
  <!-- Formulário de cadastro -->
  <div id="formCadastro">
    <h2>Cadastro de Cliente e Veículo</h2>
    <input type="text" id="nome" placeholder="Nome do motorista" required><br>
    <input type="text" id="cpf" placeholder="CPF" required><br>
    <input type="text" id="celular" placeholder="Número de celular" required><br>
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="text" id="placa" placeholder="Placa do veículo" required><br>
    <input type="text" id="cor" placeholder="Cor do veículo" required><br>
    <select id="vaga">
      <option value="0">Vaga 1</option>
      <option value="1">Vaga 2</option>
      <option value="2">Vaga 3</option>
      <option value="3">Vaga 4</option>
      <option value="4">Vaga 5</option>
    </select><br>
    <button onclick="cadastrarCliente()">Cadastrar</button>
  </div>

  <!-- Canvas do estacionamento -->
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Vagas do estacionamento
    const spots = [
      { x: 50, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 150, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 250, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 350, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 450, y: 50, width: 60, height: 100, ocupado: false, carro: null }
    ];

    function cadastrarCliente() {
      const nome = document.getElementById("nome").value;
      const cpf = document.getElementById("cpf").value;
      const celular = document.getElementById("celular").value;
      const email = document.getElementById("email").value;
      const placa = document.getElementById("placa").value;
      const cor = document.getElementById("cor").value;
      const vagaIndex = document.getElementById("vaga").value;

      if (nome && cpf && celular && email && placa && cor) {
        document.getElementById("formCadastro").style.display = "none";
        canvas.style.display = "block";

        const vaga = spots[vagaIndex];
        if (!vaga.ocupado) {
          vaga.ocupado = true;
          vaga.carro = { placa, cor, motorista: nome };
          alert("Cliente " + nome + " estacionou na vaga " + (parseInt(vagaIndex)+1));
        } else {
          alert("Essa vaga já está ocupada!");
        }

        desenharEstacionamento();
      } else {
        alert("Por favor, preencha todos os campos.");
      }
    }

    function desenharEstacionamento() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      spots.forEach((s, i) => {
        ctx.strokeStyle = s.ocupado ? "red" : "green";
        ctx.lineWidth = 3;
        ctx.strokeRect(s.x, s.y, s.width, s.height);

        if (s.ocupado && s.carro) {
          ctx.fillStyle = s.carro.cor;
          ctx.fillRect(s.x + 10, s.y + 10, 40, 70);
          ctx.fillStyle = "black";
          ctx.font = "12px Arial";
          ctx.fillText(s.carro.placa, s.x + 5, s.y + s.height + 15);
        }
      });
    }
  </script>
</body>
</html>
