<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0f2fe;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.18) 0%, transparent 60%);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 50px rgba(59, 130, 246, 0.4);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    h1 {
      text-align: center;
      font-size: 3em;
      margin: 0;
      background: linear-gradient(90deg, #60a5fa, #3b82f6, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tabela-precos {
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: center;
    }
    .tabela-precos table {
      width: 100%;
      border-collapse: collapse;
    }
    .tabela-precos th, .tabela-precos td {
      padding: 14px;
      border: 1px solid #60a5fa;
    }
    .tabela-precos th {
      background: #1e40af;
      color: white;
    }
    .tabela-precos tr:nth-child(even) {
      background: rgba(59, 130, 246, 0.1);
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 10px;
      background: #1e2937;
      color: white;
      border: 1px solid #60a5fa;
    }

    button.big-btn {
      width: 100%;
      padding: 20px;
      font-size: 1.5em;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
    }

    .ticket {
      background: #fff;
      color: #000;
      padding: 25px;
      border: 4px dashed #1e40af;
      border-radius: 12px;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,10,10,0.98);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div style="background:rgba(15,23,42,0.95);padding:50px;border-radius:20px;width:400px;text-align:center;border:2px solid #60a5fa;">
        <h1 style="font-size:3em;margin:0;">🅿️</h1>
        <h2 style="color:#60a5fa;">Estacionamento Simulator</h2>
        <button onclick="fazerLogin()" style="width:100%;padding:16px;font-size:1.2em;background:#3b82f6;color:white;border:none;border-radius:12px;margin-top:20px;">ENTRAR NO SISTEMA</button>
      </div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ ESTACIONAMENTO</h1>

      <!-- TABELA DE PREÇOS -->
      <div class="tabela-precos">
        <h3>📋 Tabela de Valores</h3>
        <table>
          <tr>
            <th>Tempo de Permanência</th>
            <th>Valor</th>
          </tr>
          <tr>
            <td>Até 1 hora</td>
            <td><strong>R$ 12,00</strong></td>
          </tr>
          <tr>
            <td>Até 2 horas</td>
            <td><strong>R$ 20,00</strong></td>
          </tr>
          <tr>
            <td>De 3 a 7 horas</td>
            <td><strong>R$ 35,00</strong></td>
          </tr>
          <tr style="background:#1e40af;color:white;">
            <td><strong>Acima de 7 horas</strong></td>
            <td><strong>R$ 50,00</strong> (valor fixo)</td>
          </tr>
        </table>
      </div>

      <div style="background:rgba(0,0,0,0.4);padding:30px;border-radius:15px;">
        <h3>🚗 Dados do Veículo</h3>
        <input type="text" id="nomePessoa" placeholder="Nome do Cliente">
        <select id="modeloVeiculo">
          <option value="">Modelo do Carro</option>
          <option value="Volkswagen Gol">Volkswagen Gol</option>
          <option value="Chevrolet Onix">Chevrolet Onix</option>
          <option value="Hyundai HB20">Hyundai HB20</option>
          <option value="Toyota Corolla">Toyota Corolla</option>
          <option value="Honda Civic">Honda Civic</option>
          <option value="Toyota Hilux">Toyota Hilux</option>
        </select>
        <input type="text" id="placaInput" placeholder="Placa (opcional)">

        <button onclick="estacionarVeiculo()" class="big-btn">
          🚗 ESTACIONAR + GERAR TICKET
        </button>
      </div>

      <h2 style="margin-top:30px;">🎟️ Tickets Gerados</h2>
      <div id="listaVeiculos"></div>
    </div>
  </div>

  <script>
    let veiculos = {};
    let vagaOcupada = {};
    const vagasTotais = 30;

    function fazerLogin() {
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('mainContent').style.display = "block";
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-' + String(Math.floor(Math.random() * 9000) + 1000);
      return placa;
    }

    // Nova função de cálculo conforme sua tabela
    function calcularValor(entrada) {
      const agora = new Date();
      const [h, m] = entrada.split(':').map(Number);
      const entradaDate = new Date();
      entradaDate.setHours(h, m);
      let horas = (agora - entradaDate) / (1000 * 60 * 60);

      if (horas <= 1) return 12;
      if (horas <= 2) return 20;
      if (horas > 7) return 50;
      return 35; // entre 3 e 7 horas
    }

    function mostrarTicket(veiculo, tipo = "ENTRADA", formaPagamento = "") {
      let html = `
        <div class="ticket">
          <h2 style="text-align:center;color:#1e40af;">🎟️ TICKET DE ${tipo}</h2>
          <hr>
          <p><strong>Vaga:</strong> ${veiculo.vaga}</p>
          <p><strong>Placa:</strong> ${veiculo.placa}</p>
          <p><strong>Cliente:</strong> ${veiculo.nome}</p>
          <p><strong>Modelo:</strong> ${veiculo.modelo}</p>
          <p><strong>${tipo}:</strong> ${tipo === "ENTRADA" ? veiculo.entrada : veiculo.saida}</p>
      `;

      if (tipo === "SAIDA") {
        const valor = calcularValor(veiculo.entrada);
        html += `<h3 style="color:#b91c1c;text-align:center;">Valor Total: R$ ${valor}</h3>
                 <p><strong>Pagamento:</strong> ${formaPagamento}</p>`;
      } else {
        html += `<button onclick="registrarSaida('${veiculo.placa}')" style="margin-top:10px;padding:12px 20px;background:#22c55e;color:white;border:none;border-radius:8px;cursor:pointer;">Sair + Pagar</button>`;
      }

      html += `</div>`;

      const div = document.createElement('div');
      div.innerHTML = html;
      document.getElementById('listaVeiculos').prepend(div);
    }

    function registrarSaida(placa) {
      const veiculo = veiculos[placa];
      if (!veiculo) return;

      const opcao = prompt("Forma de Pagamento:\n\n1 - 💵 Dinheiro\n2 - 💳 Débito\n3 - 💳 Crédito\n4 - 📱 PIX\n\nDigite o número:");

      let forma = "Não informado";
      if (opcao === "1") forma = "💵 Dinheiro";
      else if (opcao === "2") forma = "💳 Débito";
      else if (opcao === "3") forma = "💳 Crédito";
      else if (opcao === "4") forma = "📱 PIX";

      veiculo.saida = formatarHora();
      mostrarTicket(veiculo, "SAIDA", forma);

      delete veiculos[placa];
      delete vagaOcupada[veiculo.vaga];
    }

    function estacionarVeiculo() {
      const nome = document.getElementById('nomePessoa').value.trim();
      const modelo = document.getElementById('modeloVeiculo').value;

      if (!nome || !modelo) {
        alert("⚠️ Nome do cliente e Modelo do carro são obrigatórios!");
        return;
      }

      let vaga = null;
      for (let i = 1; i <= vagasTotais; i++) {
        if (!vagaOcupada[i]) {
          vaga = i;
          break;
        }
      }

      const placa = document.getElementById('placaInput').value.trim() || gerarPlaca();

      const veiculo = {
        placa: placa,
        vaga: vaga,
        nome: nome,
        modelo: modelo,
        entrada: formatarHora()
      };

      veiculos[placa] = veiculo;
      vagaOcupada[vaga] = placa;

      mostrarTicket(veiculo, "ENTRADA");

      // Limpar
      document.getElementById('nomePessoa').value = '';
      document.getElementById('placaInput').value = '';
      document.getElementById('modeloVeiculo').value = '';
    }
  </script>
</body>
</html>
