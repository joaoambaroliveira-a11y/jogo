<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; margin-bottom: 10px; }
    
    .vagas-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin: 20px 0;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }
    .vaga {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .vaga-livre { background: #22c55e; color: black; }
    .vaga-ocupada { background: #ef4444; color: white; }
    .vaga:hover { transform: scale(1.08); }

    .status {
      text-align: center;
      font-size: 1.4em;
      margin: 15px 0;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }

    .veiculo-card {
      background: rgba(255,255,255,0.12);
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border-left: 6px solid #3b82f6;
    }
    .modelo { font-size: 1.15em; font-weight: bold; color: #a5f3fc; }

    input, select, button {
      padding: 12px;
      margin: 5px;
      border: none;
      border-radius: 6px;
    }
    button {
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #2563eb; }
    .remover-btn { background: #ef4444; }

    .log {
      max-height: 280px;
      overflow-y: auto;
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🅿️ Estacionamento Simulator</h1>
    
    <div class="status" id="status">
      Vagas Totais: <strong>30</strong> | 
      Ocupadas: <strong id="ocupadas">0</strong> | 
      Sobrando: <strong id="sobrando">30</strong>
    </div>

    <h2>Mapa das Vagas (1 a 30)</h2>
    <div class="vagas-grid" id="vagasGrid"></div>

    <!-- Formulário de Estacionamento -->
    <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; margin: 20px 0;">
      <h3>🚗 Estacionar Novo Veículo</h3>
      <input type="text" id="nomePessoa" placeholder="Nome do Proprietário" style="width: 280px;">
      <select id="modeloVeiculo" style="width: 240px;">
        <option value="">Escolha o modelo</option>
        <option value="Volkswagen Gol">Volkswagen Gol</option>
        <option value="Fiat Uno">Fiat Uno</option>
        <option value="Chevrolet Onix">Chevrolet Onix</option>
        <option value="Hyundai HB20">Hyundai HB20</option>
        <option value="Toyota Corolla">Toyota Corolla</option>
        <option value="Honda Civic">Honda Civic</option>
        <option value="Toyota Hilux">Toyota Hilux</option>
        <option value="Chevrolet S10">Chevrolet S10</option>
        <option value="Fiat Strada">Fiat Strada</option>
        <option value="Renault Kwid">Renault Kwid</option>
        <option value="Jeep Compass">Jeep Compass</option>
      </select>
      <button onclick="estacionarVeiculo()">Estacionar Veículo</button>
    </div>

    <div>
      <input type="text" id="placaRemover" placeholder="Digite a placa para remover" style="width: 320px;">
      <button onclick="removerVeiculo()">Remover Veículo</button>
    </div>

    <h2>🚘 Veículos Estacionados</h2>
    <div id="listaVeiculos"></div>

    <div class="log" id="log"></div>
  </div>

  <script>
    const vagasTotais = 30;
    let veiculos = {};      // placa → dados
    let vagaOcupada = {};   // vaga → placa

    function gerarCPF() {
      let cpf = Array.from({length: 9}, () => Math.floor(Math.random() * 10));
      let d1 = cpf.reduce((s, n, i) => s + n * (10 - i), 0) % 11;
      d1 = d1 < 2 ? 0 : 11 - d1;
      cpf.push(d1);
      let d2 = cpf.reduce((s, n, i) => s + n * (11 - i), 0) % 11;
      d2 = d2 < 2 ? 0 : 11 - d2;
      cpf.push(d2);
      return cpf.join('');
    }

    function gerarRG() {
      let rg = Array.from({length: 9}, () => Math.floor(Math.random() * 10)).join('');
      return `${rg.slice(0,2)}.${rg.slice(2,5)}.${rg.slice(5,8)}-${rg[8]}`;
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-';
      for (let i = 0; i < 4; i++) placa += Math.floor(Math.random() * 10);
      return placa;
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function adicionarLog(mensagem, tipo = 'info') {
      const log = document.getElementById('log');
      const hora = formatarHora();
      const cor = tipo === 'sucesso' ? '#4ade80' : tipo === 'erro' ? '#f87171' : 'white';
      log.innerHTML += `<span style="color:${cor}">[${hora}] ${mensagem}</span><br>`;
      log.scrollTop = log.scrollHeight;
    }

    function atualizarStatus() {
      const ocupadas = Object.keys(veiculos).length;
      document.getElementById('ocupadas').textContent = ocupadas;
      document.getElementById('sobrando').textContent = vagasTotais - ocupadas;
    }

    function renderizarVagas() {
      const grid = document.getElementById('vagasGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= vagasTotais; i++) {
        const vagaDiv = document.createElement('div');
        vagaDiv.className = `vaga ${vagaOcupada[i] ? 'vaga-ocupada' : 'vaga-livre'}`;
        vagaDiv.textContent = i;
        if (vagaOcupada[i]) {
          vagaDiv.title = `Ocupada - ${vagaOcupada[i]}`;
        }
        grid.appendChild(vagaDiv);
      }
    }

    function encontrarVagaLivre() {
      for (let i = 1; i <= vagasTotais; i++) {
        if (!vagaOcupada[i]) return i;
      }
      return null;
    }

    function estacionarVeiculo() {
      if (Object.keys(veiculos).length >= vagasTotais) {
        adicionarLog("❌ Estacionamento lotado!", "erro");
        return;
      }

      const nome = document.getElementById('nomePessoa').value.trim();
      if (!nome) {
        adicionarLog("⚠️ Por favor, digite o nome do proprietário!", "erro");
        return;
      }

      const vaga = encontrarVagaLivre();
      const select = document.getElementById('modeloVeiculo');
      let modelo = select.value || "Veículo Genérico";

      const placa = gerarPlaca();
      const veiculo = {
        placa: placa,
        vaga: vaga,
        nome: nome,
        modelo: modelo,
        cpf: gerarCPF(),
        rg: gerarRG(),
        entrada: formatarHora(),
        saida: null
      };

      veiculos[placa] = veiculo;
      vagaOcupada[vaga] = placa;

      atualizarStatus();
      renderizarVagas();
      mostrarVeiculos();
      
      adicionarLog(`✅ <strong>${nome}</strong> estacionou na Vaga ${vaga} — ${modelo} (${placa})`, "sucesso");

      // Limpar campos
      document.getElementById('nomePessoa').value = '';
      select.value = '';
    }

    function removerVeiculo() {
      const placaInput = document.getElementById('placaRemover').value.trim().toUpperCase();
      if (!placaInput || !veiculos[placaInput]) {
        adicionarLog("❌ Placa não encontrada!", "erro");
        return;
      }
      removerPorPlaca(placaInput);
      document.getElementById('placaRemover').value = '';
    }

    function removerPorPlaca(placa) {
      const veiculo = veiculos[placa];
      if (!veiculo) return;

      veiculo.saida = formatarHora();

      delete veiculos[placa];
      delete vagaOcupada[veiculo.vaga];

      atualizarStatus();
      renderizarVagas();
      mostrarVeiculos();
      
      adicionarLog(`🚪 <strong>${veiculo.nome}</strong> saiu da Vaga ${veiculo.vaga} às ${veiculo.saida} — ${veiculo.modelo}`, "sucesso");
    }

    function mostrarVeiculos() {
      const lista = document.getElementById('listaVeiculos');
      lista.innerHTML = '';

      if (Object.keys(veiculos).length === 0) {
        lista.innerHTML = '<p style="text-align:center; color:#aaa;">Nenhum veículo estacionado no momento.</p>';
        return;
      }

      for (let placa in veiculos) {
        const v = veiculos[placa];
        const card = document.createElement('div');
        card.className = 'veiculo-card';
        card.innerHTML = `
          <strong>Vaga ${v.vaga}</strong> — <strong>${v.placa}</strong><br>
          <strong style="color:#67e8f9;">${v.nome}</strong><br>
          <span class="modelo">${v.modelo}</span><br><br>
          CPF: ${v.cpf} | RG: ${v.rg}<br>
          Entrada: ${v.entrada} 
          ${v.saida ? `<br><strong>Saída:</strong> ${v.saida}` : ''}
          <button class="remover-btn" onclick="removerPorPlaca('${placa}')" style="float:right;">Remover / Registrar Saída</button>
        `;
        lista.appendChild(card);
      }
    }

    // Inicialização
    atualizarStatus();
    renderizarVagas();
    mostrarVeiculos();
    adicionarLog("🚀 Sistema atualizado! Agora com Nome do Proprietário e Horário de Saída.", "sucesso");
  </script>
</body>
</html>
