<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .tabs { display: flex; margin-bottom: 15px; }
    .tab {
      padding: 12px 20px;
      background: rgba(255,255,255,0.1);
      margin-right: 5px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-weight: bold;
    }
    .tab.active { background: #3b82f6; }

    .vagas-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin: 20px 0;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }
    .vaga {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 10px;
    }
    .vaga-ocupada { background: #ef4444; color: white; }

    .status { text-align: center; font-size: 1.4em; margin: 15px 0; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; }

    .ticket {
      background: #fff;
      color: #000;
      padding: 20px;
      border: 4px dashed #000;
      border-radius: 12px;
      margin: 15px 0;
      max-width: 420px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.2s;
    }
    .ticket:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    .ticket button {
      margin-top: 12px;
      padding: 10px 20px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .ticket button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <!-- LOGIN (mesmo de antes) -->
  <div id="loginScreen">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.95);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div style="background:rgba(255,255,255,0.1);padding:40px;border-radius:15px;width:360px;text-align:center;">
        <h2>🔐 Login do Sistema</h2>
        <input type="text" id="username" value="admin" placeholder="Usuário" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;background:rgba(255,255,255,0.2);color:white;"><br>
        <input type="password" id="password" value="1234" placeholder="Senha" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;background:rgba(255,255,255,0.2);color:white;"><br>
        <button onclick="fazerLogin()" style="width:100%;padding:14px;font-size:1.1em;">Entrar</button>
      </div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ Estacionamento Simulator</h1>
      
      <div style="background:rgba(0,0,0,0.3);padding:25px;border-radius:12px;margin:20px 0;">
        <h3>🚗 Estacionar Novo Veículo</h3>
        <input type="text" id="nomePessoa" placeholder="Nome do Proprietário" style="width:100%; padding:12px; margin:8px 0;">
        <select id="modeloVeiculo" style="width:100%; padding:12px; margin:8px 0;">
          <option value="">Escolha o modelo</option>
          <option value="Volkswagen Gol">Volkswagen Gol</option>
          <option value="Chevrolet Onix">Chevrolet Onix</option>
          <option value="Hyundai HB20">Hyundai HB20</option>
          <option value="Toyota Corolla">Toyota Corolla</option>
          <option value="Honda Civic">Honda Civic</option>
        </select>
        <br><br>
        <button onclick="estacionarVeiculo()" style="padding:16px 32px; font-size:1.3em; background:#22c55e; color:white; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">
          🚗 ESTACIONAR + GERAR TICKET
        </button>
      </div>

      <h2>🎟️ Tickets Gerados</h2>
      <div id="listaVeiculos"></div>

      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const vagasTotais = 30;
    let veiculos = {};
    let vagaOcupada = {};

    function fazerLogin() {
      document.getElementById('loginScreen').style.display = "none";
      document.getElementById('mainContent').style.display = "block";
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function adicionarLog(mensagem) {
      const log = document.getElementById('log');
      const hora = formatarHora();
      log.innerHTML += `<span style="color:#4ade80">[${hora}] ${mensagem}</span><br>`;
      log.scrollTop = log.scrollHeight;
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-' + String(Math.floor(Math.random() * 9000) + 1000);
      return placa;
    }

    function mostrarTicket(veiculo) {
      const ticketHTML = `
        <div class="ticket" onclick="alert('Ticket da Vaga ${veiculo.vaga} - ${veiculo.placa}\\n\\nProprietário: ${veiculo.nome}')" style="cursor:pointer;">
          <h2 style="margin:0; text-align:center; color:#000;">🎟️ TICKET DE ESTACIONAMENTO</h2>
          <hr style="border:1px dashed #000;">
          <p><strong>Vaga:</strong> ${veiculo.vaga}</p>
          <p><strong>Placa:</strong> ${veiculo.placa}</p>
          <p><strong>Nome:</strong> ${veiculo.nome}</p>
          <p><strong>Modelo:</strong> ${veiculo.modelo}</p>
          <p><strong>Entrada:</strong> ${veiculo.entrada}</p>
          <button onclick="event.stopImmediatePropagation(); imprimirTicket(this)">🖨️ Imprimir Ticket</button>
        </div>`;

      const div = document.createElement('div');
      div.innerHTML = ticketHTML;
      document.getElementById('listaVeiculos').prepend(div);
    }

    function imprimirTicket(btn) {
      event.stopImmediatePropagation();
      const ticket = btn.parentElement;
      const originalContent = document.body.innerHTML;
      
      document.body.innerHTML = ticket.outerHTML;
      window.print();
      document.body.innerHTML = originalContent;
      location.reload(); // Recarrega para voltar ao sistema
    }

    function estacionarVeiculo() {
      const nome = document.getElementById('nomePessoa').value.trim();
      if (!nome) {
        alert("⚠️ Por favor, digite o nome do proprietário!");
        return;
      }

      let vaga = null;
      for (let i = 1; i <= vagasTotais; i++) {
        if (!vagaOcupada[i]) {
          vaga = i;
          break;
        }
      }

      const modelo = document.getElementById('modeloVeiculo').value || "Veículo Genérico";
      const placa = gerarPlaca();

      const veiculo = { placa, vaga, nome, modelo, entrada: formatarHora() };

      veiculos[placa] = veiculo;
      vagaOcupada[vaga] = placa;

      mostrarTicket(veiculo);
      adicionarLog(`✅ Ticket gerado para ${nome} - Vaga ${vaga}`);

      // Limpa campos
      document.getElementById('nomePessoa').value = '';
      document.getElementById('modeloVeiculo').value = '';
    }

    window.onload = () => {
      adicionarLog("🚀 Sistema pronto! Estacione um veículo para gerar ticket.");
    };
  </script>
</body>
</html>
