<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estacionamento com Vagas</title>
  <style>
    body { 
      margin: 0; 
      background: #eee; 
      font-family: Arial, sans-serif; 
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    canvas { 
      display: none; 
      margin: 20px auto; 
      background: #d3d3d3;
    }
    #formCadastro { 
      text-align: center; 
      padding: 20px;
      background: #111;
      border-radius: 10px;
      box-shadow: 0 0 20px cyan;
      color: white;
    }
    #formCadastro h2 {
      font-size: 32px;
      color: blue;
      text-shadow: 0 0 15px cyan;
    }
    input, select { 
      margin: 10px; 
      padding: 12px; 
      width: 280px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
    }
    button { 
      padding: 12px 25px; 
      margin-top: 15px;
      font-size: 20px;
      background: blue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 15px cyan;
    }
    button:hover {
      background: darkblue;
    }
  </style>
</head>
<body>
  <!-- Formulário de cadastro -->
  <div id="formCadastro">
    <h2>Cadastro de Cliente e Veículo</h2>
    <input type="text" id="nome" placeholder="Nome do motorista" required><br>
    <input type="text" id="celular" placeholder="Número de celular" required><br>
    <input type="text" id="modelo" placeholder="Modelo do veículo" required><br>
    <input type="text" id="placa" placeholder="Placa do veículo" required><br>
    <input type="text" id="cor" placeholder="Cor do veículo" required><br>
    <select id="vaga">
      <option value="0">Vaga 1</option>
      <option value="1">Vaga 2</option>
      <option value="2">Vaga 3</option>
      <option value="3">Vaga 4</option>
      <option value="4">Vaga 5</option>
    </select><br>
    <button onclick="cadastrarCliente()">Cadastrar</button>
  </div>

  <!-- Canvas do estacionamento -->
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const spots = [
      { x: 50, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 150, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 250, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 350, y: 50, width: 60, height: 100, ocupado: false, carro: null },
      { x: 450, y: 50, width: 60, height: 100, ocupado: false, carro: null }
    ];

    function cadastrarCliente() {
      const nome = document.getElementById("nome").value;
      const celular = document.getElementById("celular").value;
      const modelo = document.getElementById("modelo").value;
      const placa = document.getElementById("placa").value;
      const cor = document.getElementById("cor").value;
      const vagaIndex = document.getElementById("vaga").value;

      if (nome && celular && modelo && placa && cor) {
        // Ocupa a vaga escolhida
        const vaga = spots[vagaIndex];
        if (!vaga.ocupado) {
          vaga.ocupado = true;
          vaga.carro = { modelo, placa, cor, motorista: nome, celular };
          alert("Cliente " + nome + " estacionou na vaga " + (parseInt(vagaIndex)+1));
        } else {
          alert("Essa vaga já está ocupada!");
        }

        // Fecha cadastro e abre estacionamento
        document.getElementById("formCadastro").style.display = "none";
        canvas.style.display = "block";
        desenharEstacionamento();
      } else {
        alert("Por favor, preencha todos os campos.");
      }
    }

    function desenharEstacionamento() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const vagasLivres = spots.filter(s => !s.ocupado).length;
      const vagasOcupadas = spots.filter(s => s.ocupado).length;
      ctx.fillStyle = "black";
      ctx.font = "16px Arial";
      ctx.fillText("Vagas livres: " + vagasLivres, 20, 20);
      ctx.fillText("Vagas ocupadas: " + vagasOcupadas, 20, 40);

      spots.forEach((s, i) => {
        ctx.strokeStyle = s.ocupado ? "red" : "green";
        ctx.lineWidth = 3;
        ctx.strokeRect(s.x, s.y, s.width, s.height);

        if (s.ocupado && s.carro) {
          // Corpo do carro
          ctx.fillStyle = s.carro.cor;
          ctx.fillRect(s.x + 10, s.y + 20, 40, 60);

          // Vidros
          ctx.fillStyle = "lightblue";
          ctx.fillRect(s.x + 12, s.y + 22, 36, 20);

          // Faróis
          ctx.fillStyle = "yellow";
          ctx.beginPath();
          ctx.arc(s.x + 15, s.y + 20, 5, 0, Math.PI * 2);
          ctx.arc(s.x + 45, s.y + 20, 5, 0, Math.PI * 2);
          ctx.fill();

          // Rodas
          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.arc(s.x + 15, s.y + 75, 6, 0, Math.PI * 2);
          ctx.arc(s.x + 45, s.y + 75, 6, 0, Math.PI * 2);
          ctx.fill();

          // Texto da placa e modelo
          ctx.fillStyle = "black";
          ctx.font = "12px Arial";
          ctx.fillText(s.carro.placa, s.x + 5, s.y + s.height + 15);
          ctx.fillText(s.carro.modelo, s.x + 5, s.y + s.height + 30);
        }
      });
    }
  </script>
</body>
</html>
