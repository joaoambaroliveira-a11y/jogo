<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .tabs { display: flex; margin-bottom: 15px; }
    .tab {
      padding: 12px 20px;
      background: rgba(255,255,255,0.1);
      margin-right: 5px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-weight: bold;
    }
    .tab.active { background: #3b82f6; }

    .vagas-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin: 20px 0;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }
    .vaga {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 10px;
    }
    .vaga-ocupada { background: #ef4444; color: white; }

    .status { text-align: center; font-size: 1.4em; margin: 15px 0; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; }
    .veiculo-card {
      background: rgba(255,255,255,0.12);
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border-left: 6px solid #3b82f6;
    }
    .ticket {
      background: #fff;
      color: #000;
      padding: 15px;
      border: 3px dashed #000;
      border-radius: 8px;
      text-align: center;
      margin: 15px 0;
      font-family: monospace;
    }
    .log {
      max-height: 250px;
      overflow-y: auto;
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.95);display:flex;align-items:center;justify-content:center;z-index:1000;">
      <div style="background:rgba(255,255,255,0.1);padding:40px;border-radius:15px;width:360px;text-align:center;">
        <h2>🔐 Login do Sistema</h2>
        <input type="text" id="username" value="admin" placeholder="Usuário" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;background:rgba(255,255,255,0.2);color:white;"><br>
        <input type="password" id="password" value="1234" placeholder="Senha" style="width:100%;padding:12px;margin:8px 0;border-radius:8px;background:rgba(255,255,255,0.2);color:white;"><br>
        <button onclick="fazerLogin()" style="width:100%;padding:14px;font-size:1.1em;">Entrar</button>
      </div>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container">
      <h1>🅿️ Estacionamento Simulator</h1>
      
      <div class="tabs">
        <div class="tab active" onclick="showTab(0)">📋 Cadastrar Cliente</div>
        <div class="tab" onclick="showTab(1)">🅿️ Estacionamento</div>
      </div>

      <!-- ABA CADASTRO -->
      <div id="tab0">
        <h2>📋 Cadastro de Clientes</h2>
        <div style="background:rgba(0,0,0,0.3);padding:25px;border-radius:10px;">
          <input type="text" id="cadNome" placeholder="Nome Completo" style="width:100%;padding:12px;margin:8px 0;"><br>
          <input type="text" id="cadCPF" placeholder="CPF" maxlength="11" style="width:200px;padding:12px;margin:8px 0;">
          <input type="text" id="cadRG" placeholder="RG" style="width:180px;padding:12px;margin:8px 0;"><br>
          <input type="text" id="cadTelefone" placeholder="Telefone" style="width:200px;padding:12px;margin:8px 0;">
          <br><br>
          <button onclick="cadastrarCliente()" style="padding:14px 30px;font-size:1.1em;">✅ Cadastrar Cliente</button>
        </div>
        <h3>Clientes Cadastrados</h3>
        <div id="listaClientes"></div>
      </div>

      <!-- ABA ESTACIONAMENTO -->
      <div id="tab1" style="display:none;">
        <div class="status" id="status">
          Vagas Totais: <strong>30</strong> | 
          Ocupadas: <strong id="ocupadas">0</strong> | 
          Sobrando: <strong id="sobrando">30</strong>
        </div>

        <h2>🚗 Vagas Ocupadas</h2>
        <div class="vagas-grid" id="vagasGrid"></div>

        <div style="background:rgba(0,0,0,0.3);padding:20px;border-radius:10px;margin:20px 0;">
          <h3>🚗 Estacionar Veículo</h3>
          <select id="clienteSelect" style="width:100%;padding:12px;" onchange="preencherDadosCliente()">
            <option value="">Novo Cliente</option>
          </select><br><br>
          <input type="text" id="nomePessoa" placeholder="Nome do Proprietário" style="width:100%;padding:12px;"><br>
          <select id="modeloVeiculo" style="width:100%;padding:12px;">
            <option value="">Escolha o modelo</option>
            <option value="Volkswagen Gol">Volkswagen Gol</option>
            <option value="Chevrolet Onix">Chevrolet Onix</option>
            <option value="Hyundai HB20">Hyundai HB20</option>
            <option value="Toyota Corolla">Toyota Corolla</option>
            <option value="Honda Civic">Honda Civic</option>
          </select>
          <br><br>
          <button onclick="estacionarVeiculo()" style="padding:14px 30px;font-size:1.1em;">Estacionar + Gerar Ticket</button>
        </div>

        <h2>🚘 Veículos Estacionados</h2>
        <div id="listaVeiculos"></div>
      </div>

      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const vagasTotais = 30;
    const valorPorHora = 12; // R$ 12,00 por hora
    let veiculos = {};
    let vagaOcupada = {};
    let clientes = [];

    function fazerLogin() {
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      if (user === "admin" && pass === "1234") {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('mainContent').style.display = "block";
      } else {
        alert("Usuário ou senha incorretos!\n\nadmin / 1234");
      }
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function adicionarLog(mensagem, tipo = 'info') {
      const log = document.getElementById('log');
      const hora = formatarHora();
      const cor = tipo === 'sucesso' ? '#4ade80' : '#f87171';
      log.innerHTML += `<span style="color:${cor}">[${hora}] ${mensagem}</span><br>`;
      log.scrollTop = log.scrollHeight;
    }

    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-' + String(Math.floor(Math.random() * 9000) + 1000);
      return placa;
    }

    function calcularTempo(entrada) {
      const agora = new Date();
      const [h, m] = entrada.split(':').map(Number);
      const entradaDate = new Date();
      entradaDate.setHours(h, m);
      const diffMs = agora - entradaDate;
      const horas = diffMs / (1000 * 60 * 60);
      return horas.toFixed(2);
    }

    function mostrarTicket(veiculo, tipo = "ENTRADA") {
      const ticketHTML = `
        <div class="ticket">
          <h3>🎟️ TICKET DE ${tipo}</h3>
          <p><strong>Vaga:</strong> ${veiculo.vaga}</p>
          <p><strong>Placa:</strong> ${veiculo.placa}</p>
          <p><strong>Proprietário:</strong> ${veiculo.nome}</p>
          <p><strong>Modelo:</strong> ${veiculo.modelo}</p>
          <p><strong>${tipo === "ENTRADA" ? "Entrada" : "Saída"}:</strong> ${tipo === "ENTRADA" ? veiculo.entrada : veiculo.saida}</p>
          ${tipo === "SAIDA" ? `<p><strong>Tempo:</strong> ${calcularTempo(veiculo.entrada)} horas</p><p><strong>Valor:</strong> R$ ${(calcularTempo(veiculo.entrada) * valorPorHora).toFixed(2)}</p>` : ''}
          <small>Estacionamento Simulator • Obrigado!</small>
        </div>`;
      
      const div = document.createElement('div');
      div.innerHTML = ticketHTML;
      document.getElementById('listaVeiculos').prepend(div);
    }

    function cadastrarCliente() {
      const nome = document.getElementById('cadNome').value.trim();
      const cpf = document.getElementById('cadCPF').value.trim();
      if (!nome || !cpf) {
        alert("Nome e CPF são obrigatórios!");
        return;
      }
      clientes.push({ nome, cpf, rg: document.getElementById('cadRG').value.trim(), telefone: document.getElementById('cadTelefone').value.trim() });
      atualizarListaClientes();
      atualizarSelectClientes();
      document.getElementById('cadNome').value = '';
      document.getElementById('cadCPF').value = '';
      document.getElementById('cadRG').value = '';
      document.getElementById('cadTelefone').value = '';
      adicionarLog(`✅ Cliente ${nome} cadastrado!`, "sucesso");
    }

    function atualizarListaClientes() {
      const lista = document.getElementById('listaClientes');
      lista.innerHTML = clientes.length === 0 ? '<p style="color:#aaa;">Nenhum cliente cadastrado.</p>' : '';
      clientes.forEach(c => {
        const div = document.createElement('div');
        div.className = 'veiculo-card';
        div.innerHTML = `<strong>${c.nome}</strong><br>CPF: ${c.cpf}`;
        lista.appendChild(div);
      });
    }

    function atualizarSelectClientes() {
      const select = document.getElementById('clienteSelect');
      select.innerHTML = '<option value="">Novo Cliente</option>';
      clientes.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${c.nome} (${c.cpf})`;
        select.appendChild(opt);
      });
    }

    function preencherDadosCliente() {
      const select = document.getElementById('clienteSelect');
      if (select.value === "") return;
      document.getElementById('nomePessoa').value = clientes[select.value].nome;
    }

    function estacionarVeiculo() {
      if (Object.keys(veiculos).length >= vagasTotais) {
        alert("Estacionamento lotado!");
        return;
      }
      const nome = document.getElementById('nomePessoa').value.trim();
      if (!nome) {
        alert("Digite o nome do proprietário!");
        return;
      }

      const vaga = Math.max(...Array.from({length: vagasTotais}, (_, i) => i+1).filter(i => !vagaOcupada[i])) || 1;
      const modelo = document.getElementById('modeloVeiculo').value || "Veículo Genérico";
      const placa = gerarPlaca();

      const veiculo = {
        placa, vaga, nome, modelo,
        entrada: formatarHora(),
        saida: null
      };

      veiculos[placa] = veiculo;
      vagaOcupada[vaga] = placa;

      atualizarStatus();
      renderizarVagas();
      mostrarVeiculos();
      mostrarTicket(veiculo, "ENTRADA");

      adicionarLog(`✅ ${nome} estacionou na Vaga ${vaga} (${placa})`, "sucesso");

      // Limpar campos
      document.getElementById('nomePessoa').value = '';
      document.getElementById('clienteSelect').value = '';
      document.getElementById('modeloVeiculo').value = '';
    }

    function removerPorPlaca(placa) {
      const veiculo = veiculos[placa];
      if (!veiculo) return;

      veiculo.saida = formatarHora();
      const tempo = calcularTempo(veiculo.entrada);
      const valor = (tempo * valorPorHora).toFixed(2);

      mostrarTicket(veiculo, "SAIDA");

      delete veiculos[placa];
      delete vagaOcupada[veiculo.vaga];

      atualizarStatus();
      renderizarVagas();
      mostrarVeiculos();

      adicionarLog(`🚪 ${veiculo.nome} saiu | ${tempo}h | R$ ${valor}`, "sucesso");
    }

    function mostrarVeiculos() {
      const lista = document.getElementById('listaVeiculos');
      lista.innerHTML = '';
      Object.keys(veiculos).forEach(placa => {
        const v = veiculos[placa];
        const card = document.createElement('div');
        card.className = 'veiculo-card';
        card.innerHTML = `
          <strong>Vaga ${v.vaga}</strong> — ${v.placa}<br>
          <strong>${v.nome}</strong> — ${v.modelo}<br>
          Entrada: ${v.entrada}
          <button onclick="removerPorPlaca('${placa}')" style="float:right;background:#ef4444;padding:8px 12px;">Sair + Pagar</button>
        `;
        lista.appendChild(card);
      });
    }

    function atualizarStatus() {
      const ocupadas = Object.keys(veiculos).length;
      document.getElementById('ocupadas').textContent = ocupadas;
      document.getElementById('sobrando').textContent = vagasTotais - ocupadas;
    }

    function renderizarVagas() {
      const grid = document.getElementById('vagasGrid');
      grid.innerHTML = '';
      let temOcupada = false;
      for (let i = 1; i <= vagasTotais; i++) {
        if (vagaOcupada[i]) {
          temOcupada = true;
          const div = document.createElement('div');
          div.className = 'vaga vaga-ocupada';
          div.textContent = i;
          grid.appendChild(div);
        }
      }
      if (!temOcupada) grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#aaa;">Nenhuma vaga ocupada</p>';
    }

    function showTab(n) {
      document.getElementById('tab0').style.display = n === 0 ? 'block' : 'none';
      document.getElementById('tab1').style.display = n === 1 ? 'block' : 'none';
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
    }
  </script>
</body>
</html>
