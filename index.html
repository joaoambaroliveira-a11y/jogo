<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🅿️ Estacionamento Simulator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Tela de Login */
    #loginScreen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-box {
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 15px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .login-box h2 { margin-bottom: 25px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    input::placeholder { color: #cbd5e1; }

    button {
      padding: 12px 30px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #2563eb; }

    /* Resto do estilo (mesmo de antes) */
    .tabs { display: flex; margin-bottom: 15px; }
    .tab {
      padding: 12px 20px;
      background: rgba(255,255,255,0.1);
      margin-right: 5px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-weight: bold;
    }
    .tab.active { background: #3b82f6; }

    .vagas-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin: 20px 0;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
    }
    .vaga {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 10px;
    }
    .vaga-ocupada { background: #ef4444; color: white; }

    .status { text-align: center; font-size: 1.4em; margin: 15px 0; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; }

    .veiculo-card {
      background: rgba(255,255,255,0.12);
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      border-left: 6px solid #3b82f6;
    }
    .modelo { font-size: 1.15em; font-weight: bold; color: #a5f3fc; }

    .log {
      max-height: 250px;
      overflow-y: auto;
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>🔐 Acesso ao Estacionamento</h2>
      <input type="text" id="username" placeholder="Usuário" value="admin"><br>
      <input type="password" id="password" placeholder="Senha" value="1234"><br>
      <button onclick="fazerLogin()">Entrar</button>
      <p style="margin-top: 20px; font-size: 0.9em; color: #94a3b8;">
        Usuário: <strong>admin</strong><br>
        Senha: <strong>1234</strong>
      </p>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL (escondido até login) -->
  <div id="mainContent" style="display: none;">
    <div class="container">
      <h1>🅿️ Estacionamento Simulator</h1>
      
      <div class="tabs">
        <div class="tab active" onclick="showTab(0)">📋 Cadastrar Cliente</div>
        <div class="tab" onclick="showTab(1)">🅿️ Estacionamento</div>
      </div>

      <!-- ABA CADASTRO -->
      <div id="tab0">
        <h2>📋 Cadastro de Clientes</h2>
        <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px;">
          <input type="text" id="cadNome" placeholder="Nome Completo" style="width: 280px;"><br>
          <input type="text" id="cadCPF" placeholder="CPF" maxlength="11" style="width: 200px;">
          <input type="text" id="cadRG" placeholder="RG" style="width: 180px;"><br>
          <input type="text" id="cadTelefone" placeholder="Telefone (opcional)" style="width: 200px;">
          <button onclick="cadastrarCliente()">Cadastrar Cliente</button>
        </div>

        <h3>Clientes Cadastrados</h3>
        <div id="listaClientes"></div>
      </div>

      <!-- ABA ESTACIONAMENTO -->
      <div id="tab1" style="display: none;">
        <div class="status" id="status">
          Vagas Totais: <strong>30</strong> | 
          Ocupadas: <strong id="ocupadas">0</strong> | 
          Sobrando: <strong id="sobrando">30</strong>
        </div>

        <h2>🚗 Vagas Ocupadas</h2>
        <div class="vagas-grid" id="vagasGrid"></div>

        <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; margin: 20px 0;">
          <h3>Estacionar Novo Veículo</h3>
          <select id="clienteSelect" style="width: 320px;" onchange="preencherDadosCliente()">
            <option value="">Novo Cliente</option>
          </select><br>
          
          <input type="text" id="nomePessoa" placeholder="Nome do Proprietário" style="width: 280px;">
          <select id="modeloVeiculo" style="width: 240px;">
            <option value="">Escolha o modelo</option>
            <option value="Volkswagen Gol">Volkswagen Gol</option>
            <option value="Fiat Uno">Fiat Uno</option>
            <option value="Chevrolet Onix">Chevrolet Onix</option>
            <option value="Hyundai HB20">Hyundai HB20</option>
            <option value="Toyota Corolla">Toyota Corolla</option>
            <option value="Honda Civic">Honda Civic</option>
            <option value="Toyota Hilux">Toyota Hilux</option>
            <option value="Chevrolet S10">Chevrolet S10</option>
          </select>
          <button onclick="estacionarVeiculo()">Estacionar Veículo</button>
        </div>

        <div>
          <input type="text" id="placaRemover" placeholder="Digite a placa para remover" style="width: 320px;">
          <button onclick="removerVeiculo()">Remover Veículo</button>
        </div>

        <h2>🚘 Veículos Estacionados</h2>
        <div id="listaVeiculos"></div>
      </div>

      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const vagasTotais = 30;
    let veiculos = {};
    let vagaOcupada = {};
    let clientes = [];

    // ==================== LOGIN ====================
    function fazerLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === "admin" && password === "1234") {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        adicionarLog("✅ Login realizado com sucesso! Bem-vindo ao sistema.", "sucesso");
      } else {
        alert("Usuário ou senha incorretos!\n\nDica: admin / 1234");
      }
    }

    // ==================== RESTO DO CÓDIGO (mesmo de antes) ====================
    function gerarPlaca() {
      const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let placa = '';
      for (let i = 0; i < 3; i++) placa += letras[Math.floor(Math.random() * 26)];
      placa += '-';
      for (let i = 0; i < 4; i++) placa += Math.floor(Math.random() * 10);
      return placa;
    }

    function formatarHora() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function adicionarLog(mensagem, tipo = 'info') {
      const log = document.getElementById('log');
      const hora = formatarHora();
      const cor = tipo === 'sucesso' ? '#4ade80' : tipo === 'erro' ? '#f87171' : 'white';
      log.innerHTML += `<span style="color:${cor}">[${hora}] ${mensagem}</span><br>`;
      log.scrollTop = log.scrollHeight;
    }

    function atualizarStatus() {
      const ocupadas = Object.keys(veiculos).length;
      document.getElementById('ocupadas').textContent = ocupadas;
      document.getElementById('sobrando').textContent = vagasTotais - ocupadas;
    }

    function renderizarVagas() {
      const grid = document.getElementById('vagasGrid');
      grid.innerHTML = '';
      let temOcupada = false;
      for (let i = 1; i <= vagasTotais; i++) {
        if (vagaOcupada[i]) {
          temOcupada = true;
          const vagaDiv = document.createElement('div');
          vagaDiv.className = 'vaga vaga-ocupada';
          vagaDiv.textContent = i;
          vagaDiv.title = `Vaga ${i} - ${vagaOcupada[i]}`;
          grid.appendChild(vagaDiv);
        }
      }
      if (!temOcupada) {
        grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #aaa; padding: 20px;">Nenhuma vaga ocupada no momento.</p>';
      }
    }

    function encontrarVagaLivre() {
      for (let i = 1; i <= vagasTotais; i++) {
        if (!vagaOcupada[i]) return i;
      }
      return null;
    }

    function cadastrarCliente() {
      const nome = document.getElementById('cadNome').value.trim();
      const cpf = document.getElementById('cadCPF').value.trim();
      if (!nome || !cpf) {
        adicionarLog("⚠️ Nome e CPF são obrigatórios!", "erro");
        return;
      }
      clientes.push({ nome, cpf, rg: document.getElementById('cadRG').value.trim(), telefone: document.getElementById('cadTelefone').value.trim() });
      atualizarListaClientes();
      atualizarSelectClientes();
      document.getElementById('cadNome').value = '';
      document.getElementById('cadCPF').value = '';
      document.getElementById('cadRG').value = '';
      document.getElementById('cadTelefone').value = '';
      adicionarLog(`✅ Cliente <strong>${nome}</strong> cadastrado!`, "sucesso");
    }

    function atualizarListaClientes() {
      const lista = document.getElementById('listaClientes');
      lista.innerHTML = clientes.length === 0 ? '<p style="color:#aaa;">Nenhum cliente cadastrado ainda.</p>' : '';
      clientes.forEach(c => {
        const div = document.createElement('div');
        div.className = 'veiculo-card';
        div.innerHTML = `<strong>${c.nome}</strong><br>CPF: ${c.cpf} | RG: ${c.rg || 'Não informado'}<br>Telefone: ${c.telefone || 'Não informado'}`;
        lista.appendChild(div);
      });
    }

    function atualizarSelectClientes() {
      const select = document.getElementById('clienteSelect');
      select.innerHTML = '<option value="">Novo Cliente</option>';
      clientes.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${c.nome} (${c.cpf})`;
        select.appendChild(opt);
      });
    }

    function preencherDadosCliente() {
      const select = document.getElementById('clienteSelect');
      if (select.value === "") return;
      document.getElementById('nomePessoa').value = clientes[select.value].nome;
    }

    function estacionarVeiculo() {
      if (Object.keys(veiculos).length >= vagasTotais) {
        adicionarLog("❌ Estacionamento lotado!", "erro");
        return;
      }
      const nome = document.getElementById('nomePessoa').value.trim();
      if (!nome) {
        adicionarLog("⚠️ Digite o nome do proprietário!", "erro");
        return;
      }
      const vaga = encontrarVagaLivre();
      const modelo = document.getElementById('modeloVeiculo').value || "Veículo Genérico";
      const placa = gerarPlaca();

      veiculos[placa] = { placa, vaga, nome, modelo, entrada: formatarHora(), saida: null };
      vagaOcupada[vaga] = placa;

      atualizarStatus();
      renderizarVagas();
      mostrarVeiculos();
      adicionarLog(`✅ <strong>${nome}</strong> estacionou na Vaga ${vaga} — ${modelo} (${placa})`, "sucesso");

      document.getElementById('nomePessoa').value = '';
      document.getElementById('clienteSelect').value = '';
      document.getElementById('modeloVeiculo').value = '';
    }

    function removerPorPlaca(placa) {
      const veiculo = veiculos[placa];
      if (!veiculo) return;
      veiculo.saida = formatarHora();
      delete veiculos[placa];
      delete vagaOcupada[veiculo.vaga];
      atualizarStatus();
      renderizarVagas();
      mostrarVeiculos();
      adicionarLog(`🚪 <strong>${veiculo.nome}</strong> saiu da Vaga ${veiculo.vaga} às ${veiculo.saida}`, "sucesso");
    }

    function removerVeiculo() {
      const placa = document.getElementById('placaRemover').value.trim().toUpperCase();
      if (!placa || !veiculos[placa]) {
        adicionarLog("❌ Placa não encontrada!", "erro");
        return;
      }
      removerPorPlaca(placa);
      document.getElementById('placaRemover').value = '';
    }

    function mostrarVeiculos() {
      const lista = document.getElementById('listaVeiculos');
      lista.innerHTML = Object.keys(veiculos).length === 0 ? 
        '<p style="text-align:center; color:#aaa;">Nenhum veículo estacionado.</p>' : '';

      for (let placa in veiculos) {
        const v = veiculos[placa];
        const card = document.createElement('div');
        card.className = 'veiculo-card';
        card.innerHTML = `
          <strong>Vaga ${v.vaga}</strong> — <strong>${v.placa}</strong><br>
          <strong style="color:#67e8f9;">${v.nome}</strong><br>
          <span class="modelo">${v.modelo}</span><br><br>
          Entrada: ${v.entrada} ${v.saida ? `<br><strong>Saída:</strong> ${v.saida}` : ''}
          <button class="remover-btn" onclick="removerPorPlaca('${placa}')" style="float:right; background:#ef4444; padding:8px 12px;">Registrar Saída</button>
        `;
        lista.appendChild(card);
      }
    }

    function showTab(n) {
      document.getElementById('tab0').style.display = n === 0 ? 'block' : 'none';
      document.getElementById('tab1').style.display = n === 1 ? 'block' : 'none';
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
    }

    // Inicialização
    atualizarStatus();
    renderizarVagas();
    mostrarVeiculos();
    atualizarListaClientes();
  </script>
</body>
</html>
